<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 120" width="640" height="120" role="img" aria-label="ryfcx">
  <style>
    @font-face {
      font-family: "Roboto Mono Sub";
      src: url(data:font/woff2;base64,) format("woff2");
    }
    .wm { font-family: "Roboto Mono Sub", ui-monospace, "Roboto Mono", SFMono-Regular, Menlo, Consolas, monospace;
          font-size: 56px; font-weight: 300; fill: #f0f6fc; }
  </style>

  <clipPath id="cw" clipPathUnits="userSpaceOnUse">
    <rect x="205" y="20" width="0" height="56">
      <animate attributeName="width" values="0;46;92;138;184;230" calcMode="discrete" dur="1.0s" fill="freeze"/>
    </rect>
  </clipPath>

  <g clip-path="url(#cw)">
    <text class="wm" x="205" y="66" textLength="230" lengthAdjust="spacing">ryfcx</text>
  </g>

  <rect x="205" y="24" width="3" height="46" fill="#f0f6fc">
    <animate attributeName="x" values="205;251;297;343;389;435" calcMode="discrete" dur="1.0s" fill="freeze"/>
    <animate attributeName="opacity" values="1;1;0;0" calcMode="discrete" dur="1s" begin="1.0s" repeatCount="indefinite"/>
  </rect>
</svg>
