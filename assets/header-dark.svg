<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="320" height="100" role="img" aria-label="Ryan">
  <defs>
    <style>
      @font-face {
        font-family: "Roboto Mono Sub";
        src: url(data:font/woff2;base64,) format("woff2");
      }
      .wm { font-family: "Roboto Mono Sub", ui-monospace, "Roboto Mono", SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 56px; font-weight: 700; letter-spacing: 2px; fill: url(#neon); }
    </style>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472ff"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <text class="wm" x="160" y="66" text-anchor="middle" textLength="230" lengthAdjust="spacing" filter="url(#glow)" opacity="0.55">Ryan</text>
  <text class="wm" x="160" y="66" text-anchor="middle" textLength="230" lengthAdjust="spacing">Ryan</text>
</svg>
