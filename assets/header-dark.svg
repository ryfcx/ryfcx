<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 170" width="640" height="170" role="img" aria-label="ryfcx — building websites, apps, games and AI">
  <style>
    .wm {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 74px; font-weight: 300; letter-spacing: 10px;
      fill: #f0f6fc;
      animation: rise .8s cubic-bezier(.2,.7,.3,1) both;
    }
    .sub {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 13px; letter-spacing: 3.5px;
      fill: #8b949e;
      animation: rise .8s .35s cubic-bezier(.2,.7,.3,1) both;
    }
    .rule {
      stroke: #30363d; stroke-width: 1;
      transform-box: fill-box; transform-origin: center;
      animation: sweep .9s .2s cubic-bezier(.2,.7,.3,1) both;
    }
    .dot { fill: #f0f6fc; animation: pulse 2.8s 1.2s ease-in-out infinite; }
    @keyframes rise  { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes sweep { from { opacity: 0; transform: scaleX(0); }      to { opacity: 1; transform: none; } }
    @keyframes pulse { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
  </style>

  <text class="wm"  x="320" y="76"  text-anchor="middle">ryfcx</text>
  <line class="rule" x1="230" y1="104" x2="410" y2="104"/>
  <circle class="dot" cx="320" cy="104" r="2.5"/>
  <text class="sub" x="320" y="136" text-anchor="middle">websites · apps · games · ai</text>
</svg>
